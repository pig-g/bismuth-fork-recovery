name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest tests/ -q

  foundation-upstream-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: git clone --depth 1 https://github.com/bismuthfoundation/Bismuth.git /tmp/Bismuth
      - run: python -m pip install pytest simple-crypt --no-deps
      - run: python -m pip install -r /tmp/Bismuth/requirements-node.txt
      - run: BISMUTH_SOURCE_DIR=/tmp/Bismuth python -m pytest tests/ -q
